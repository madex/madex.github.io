  <path d="M118 128 Q256 46 394 128" fill="none" stroke="#b9a07e" stroke-width="72" stroke-linecap="round"/>
  <path d="M118 128 Q256 46 394 128" fill="none" stroke="#efe3cf" stroke-width="62" stroke-linecap="round"/>
  <g>
