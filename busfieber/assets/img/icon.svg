<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5aa6ff"/><stop offset="1" stop-color="#1c56cc"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <!-- Fahrzeug von oben, Mitte im Ursprung, vorne = oben -->
    <g id="car">
      <rect x="-31" y="-52" width="62" height="104" rx="18" fill="currentColor"/>
      <rect x="-31" y="-52" width="62" height="104" rx="18" fill="none" stroke="#000" stroke-opacity=".28" stroke-width="5"/>
      <rect x="-23" y="-22" width="46" height="56" rx="10" fill="#fff" fill-opacity=".28"/>
      <rect x="-24" y="-43" width="48" height="16" rx="6" fill="#1e293b" fill-opacity=".85"/>
      <path d="M0 -14 L17 4 H7 V28 H-7 V4 H-17 Z" fill="#fff" stroke="#0f172a" stroke-opacity=".7" stroke-width="4" stroke-linejoin="round"/>
    </g>
    <g id="bus">
      <rect x="-36" y="-92" width="72" height="184" rx="18" fill="#ffc21a"/>
      <rect x="-36" y="-92" width="72" height="184" rx="18" fill="none" stroke="#a86a00" stroke-width="6"/>
      <rect x="-26" y="-56" width="52" height="138" rx="12" fill="#ffe27a"/>
      <rect x="-28" y="-82" width="56" height="18" rx="7" fill="#1e293b" fill-opacity=".88"/>
      <g fill="#1e293b" fill-opacity=".55"><rect x="-35" y="-44" width="7" height="26" rx="3"/><rect x="28" y="-44" width="7" height="26" rx="3"/><rect x="-35" y="-6" width="7" height="26" rx="3"/><rect x="28" y="-6" width="7" height="26" rx="3"/><rect x="-35" y="32" width="7" height="26" rx="3"/><rect x="28" y="32" width="7" height="26" rx="3"/></g>
      <path d="M0 -44 L28 -12 H11 V54 H-11 V-12 H-28 Z" fill="#fff" stroke="#0f172a" stroke-opacity=".75" stroke-width="6" stroke-linejoin="round"/>
    </g>
    <g id="p"><ellipse cx="0" cy="16" rx="14" ry="5" fill="#000" opacity=".25"/><rect x="-12" y="-4" width="24" height="21" rx="9" fill="currentColor"/><circle cx="0" cy="-10" r="10" fill="#ffd2a8"/><path d="M-10 -11a10 10 0 0 1 20 0q-10 -4 -20 0z" fill="#5a3a2a"/></g>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- Parkplatzfläche -->
  <rect x="62" y="150" width="388" height="300" rx="46" fill="#000" opacity=".16"/>
  <!-- Autos schräg drumherum -->
  <g filter="drop-shadow(0 8px 0 rgba(0,0,0,.22))">
    <use href="#car" color="#ef4444" transform="translate(132 250) rotate(-30)"/>
    <use href="#car" color="#22c55e" transform="translate(140 378) rotate(90)"/>
    <use href="#car" color="#a855f7" transform="translate(384 262) rotate(35)"/>
    <use href="#car" color="#f472b6" transform="translate(378 384) rotate(-120)"/>
    <use href="#bus" transform="translate(258 318) rotate(18)"/>
