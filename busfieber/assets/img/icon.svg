    <use href="#p" color="#22c55e" transform="translate(308 92)"/>
    <use href="#p" color="#facc15" transform="translate(338 104)"/>
    <use href="#p" color="#3b82f6" transform="translate(166 128)"/>
    <use href="#p" color="#ef4444" transform="translate(228 112)"/>
    <use href="#p" color="#a855f7" transform="translate(260 112)"/>
    <use href="#p" color="#22c55e" transform="translate(292 116)"/>
    <use href="#p" color="#facc15" transform="translate(324 128)"/>
