<input id="mobile_kbd" type="text" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false" aria-hidden="true"
       style="position:fixed; top:0; left:0; width:2px; height:2px; opacity:0; border:0; padding:0; font-size:16px;">
<script type="text/javascript">
/* iOS/Android: Bildschirmtastatur oeffnen, wenn auf das Terminal getippt wird.
   Die Software-Tastatur erscheint nur bei fokussiertem Eingabefeld, daher
   wird ein unsichtbares Feld fokussiert und dessen Eingaben an das Terminal
   weitergereicht.
   - preventDefault im touchend: verhindert den nachlaufenden Klick, der dem
     Feld sonst sofort wieder den Fokus nimmt (Tastatur ging direkt wieder zu)
   - Feld liegt fixiert im Viewport mit font-size 16px: verhindert, dass iOS
     beim Fokussieren zoomt oder zum Feld scrollt
   - Space und Backspace werden per keydown behandelt (preventDefault stoppt
     das Scrollen der Seite und unterdrueckt zugleich keypress/input, daher
     keine doppelten Zeichen) */
(function() {
    var kbd = document.getElementById("mobile_kbd");

    document.addEventListener("touchend", function(e) {
        if (e.target && e.target.closest && e.target.closest("td.term")) {
            e.preventDefault();
            try { kbd.focus({preventScroll: true}); } catch (ex) { kbd.focus(); }
        }
    }, false);

    /* Zeichen, die nicht schon ueber keypress verarbeitet wurden
       (iOS liefert nicht immer keypress-Events) */
    kbd.addEventListener("input", function() {
        var v = kbd.value;
        kbd.value = "";
        if (v && window.term) { term.handler(v); }
    });

    kbd.addEventListener("keydown", function(e) {
        var s = null;
        if (e.key === "Backspace") { s = "\x7f"; }
        else if (e.key === " " || e.key === "Spacebar") { s = " "; }
        if (s !== null) {
            e.preventDefault();
            e.stopPropagation();
            if (window.term) { term.handler(s); }
        }
    }, true);
})();
</script>
